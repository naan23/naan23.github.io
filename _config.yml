# Site
name: 'Life of Anna B'
description: 'blog, anna, anna b, life of anna b, lifestyle, travel, leefstijl, reizen'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: ''
# disqus: 'demowebsite'
email: 'antigonetravels@gmail.com'
# mailchimp-list: 'https://wowthemes.us11.list-manage.com/subscribe/post?u=8aeb20a530e124561927d3bd8&amp;id=8c3d2d214b'

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  
authors:
    Anna:
      name:           Anna
      avatar:         assets/images/avatar1.jpg
      bio:            "Hey, ik ben Anna en ik ben de maker van dit blog. Met jou deel ik al mijn lifestyle tips en ik neem je graag mee in de wondere wereld van mijn leven."
      email:          antigonetravels@gmail.com
      instagram:      lifeofanna.b


 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: sal
      avatar: assets/images/avatar1.jpg
      
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]